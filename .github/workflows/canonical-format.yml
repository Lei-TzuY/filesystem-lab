name: Canonical format

on:
  push:
    branches:
      - conquest/directory-capacity-planning

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Apply canonical rustfmt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/directory-capacity-planning
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Apply canonical rustfmt"
          git push origin HEAD:conquest/directory-capacity-planning
