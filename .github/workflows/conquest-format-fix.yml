name: Conquest Format Fix

on:
  push:
    branches:
      - conquest/path-rmdir-recovery-boundary

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip-format-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/path-rmdir-recovery-boundary
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply stable rustfmt
        run: cargo fmt --all
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "Lei-TzuY"
            git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
            git add -A
            git commit -m "Apply stable rustfmt [skip-format-fix]"
            git push origin HEAD:conquest/path-rmdir-recovery-boundary
          fi
