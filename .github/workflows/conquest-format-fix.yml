name: Conquest format fix

on:
  push:
    branches:
      - conquest/path-symlink-rename-overwrite

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "filesystem-lab-ci"
          git config user.email "filesystem-lab-ci@users.noreply.github.com"
          git add --all
          git commit -m "Apply canonical rustfmt"
          git push
