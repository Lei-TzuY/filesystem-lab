name: Temporary rustfmt

on:
  push:
    branches:
      - conquest/path-rename-recovery-boundary

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.event.head_commit.message != 'Apply rustfmt formatting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "LeiZ"
            git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
            git add src/path_rename.rs tests/path_rename_recovery_boundary.rs
            git commit -m "Apply rustfmt formatting"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
