name: Clippy BIL-127

on:
  push:
    branches:
      - bil-127-collapse-file-block-range

permissions:
  contents: write

jobs:
  clippy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bil-127-collapse-file-block-range
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Capture diagnostics
        run: cargo clippy --all-targets --all-features -- -D warnings > clippy-bil-127.txt 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clippy-bil-127.txt
          git commit -m "Capture BIL-127 clippy diagnostics"
          git push origin HEAD:bil-127-collapse-file-block-range
