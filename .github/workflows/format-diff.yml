name: Format Diff

on:
  push:
    branches:
      - conquest/path-symlink-hard-link

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          cargo fmt --all
          git diff > format.diff
      - uses: actions/upload-artifact@v4
        with:
          name: format-diff
          path: format.diff
