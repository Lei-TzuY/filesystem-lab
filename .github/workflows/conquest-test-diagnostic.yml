name: Conquest Test Diagnostic

on:
  push:
    branches:
      - conquest/path-rmdir-recovery-boundary

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[skip-test-diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/path-rmdir-recovery-boundary
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture targeted test
        run: |
          set +e
          cargo test --test path_rmdir_recovery_boundary -- --nocapture > conquest-test-output.txt 2>&1
          status=$?
          echo "exit_status=$status" >> conquest-test-output.txt
          git config user.name "Lei-TzuY"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add conquest-test-output.txt
          git commit -m "Capture rmdir crash regression output [skip-test-diagnostic]"
          git push origin HEAD:conquest/path-rmdir-recovery-boundary
