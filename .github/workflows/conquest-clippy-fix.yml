name: Conquest clippy fix

on:
  push:
    branches:
      - conquest/path-symlink-rename-overwrite

permissions:
  contents: write

jobs:
  clippy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo clippy --fix --allow-dirty --allow-staged --all-targets --all-features -- -D warnings
      - run: cargo fmt --all
      - name: Commit machine-applicable fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "filesystem-lab-ci"
          git config user.email "filesystem-lab-ci@users.noreply.github.com"
          git add --all
          git commit -m "Apply clippy fixes"
          git push
