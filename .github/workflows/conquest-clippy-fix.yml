name: Conquest clippy diagnostic

on:
  push:
    branches:
      - conquest/path-symlink-rename-overwrite

permissions:
  contents: write

jobs:
  clippy-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Capture exact clippy output
        run: cargo clippy --all-targets --all-features -- -D warnings > conquest-clippy.log 2>&1 || true
      - name: Commit diagnostic
        run: |
          git config user.name "filesystem-lab-ci"
          git config user.email "filesystem-lab-ci@users.noreply.github.com"
          git add conquest-clippy.log
          git commit -m "Capture clippy diagnostic"
          git push
