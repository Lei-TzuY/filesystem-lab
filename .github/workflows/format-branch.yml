name: Format branch

on:
  push:
    branches:
      - conquest/configurable-metadata-geometry

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/configurable-metadata-geometry
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/format_geometry.rs tests/format_geometry_scaling.rs
          git commit -m "Apply canonical rustfmt"
          git push origin HEAD:conquest/configurable-metadata-geometry
