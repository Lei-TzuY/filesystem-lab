name: rustfmt-diagnostic
on:
  push:
    branches:
      - conquest/path-block-range-insert
jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-output
          path: |
            src/path_insert.rs
            tests/path_insert.rs
