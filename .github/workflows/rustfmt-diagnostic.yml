name: rustfmt-diagnostic

on:
  push:
    branches:
      - conquest/path-data-splice

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: git diff > rustfmt.diff
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-diff
          path: rustfmt.diff
