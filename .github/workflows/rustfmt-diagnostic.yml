name: Rustfmt diagnostic

on:
  pull_request:

jobs:
  format-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-output
          path: |
            src/lib.rs
            src/path_exchange.rs
            tests/path_exchange.rs
