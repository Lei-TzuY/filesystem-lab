name: Conquest rustfmt diagnostic

on:
  push:
    branches:
      - conquest/path-rename-exchange

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-output
          path: |
            src/path_rename.rs
            tests/path_rename_exchange.rs
