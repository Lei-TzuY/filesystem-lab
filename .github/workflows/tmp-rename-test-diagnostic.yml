name: Temporary rename test diagnostic

on:
  push:
    branches:
      - conquest/path-rename-recovery-boundary

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message != 'Capture rename test output'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture focused test output
        run: |
          set +e
          cargo test --test path_rename_recovery_boundary -- --nocapture > rename-test-output.txt 2>&1
          status=$?
          set -e
          printf '\nexit_status=%s\n' "$status" >> rename-test-output.txt
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add rename-test-output.txt
          git commit -m "Capture rename test output"
          git push origin HEAD:${GITHUB_REF_NAME}
