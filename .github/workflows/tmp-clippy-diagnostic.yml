name: Temporary clippy diagnostic

on:
  push:
    branches:
      - conquest/path-rename-recovery-boundary

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message != 'Capture clippy output'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Capture clippy output
        run: |
          set +e
          cargo clippy --all-targets --all-features -- -D warnings > clippy-output.txt 2>&1
          status=$?
          set -e
          printf '\nexit_status=%s\n' "$status" >> clippy-output.txt
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add clippy-output.txt
          git commit -m "Capture clippy output"
          git push origin HEAD:${GITHUB_REF_NAME}
