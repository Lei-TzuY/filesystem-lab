name: rustfmt-artifact

on:
  push:
    branches:
      - conquest/path-block-batch-overwrite

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-output
          path: |
            src/path_overwrite_batch.rs
            tests/path_overwrite_batch.rs
