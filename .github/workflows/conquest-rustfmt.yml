name: Conquest rustfmt

on:
  push:
    branches:
      - conquest/path-append-recovery-boundary

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/path-append-recovery-boundary
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/path_append.rs tests/path_append.rs
          git commit -m "Apply rustfmt to pathname append slice"
          git push origin HEAD:conquest/path-append-recovery-boundary
