name: Format diagnostic

on:
  push:
    branches:
      - conquest/linked-symlink-rename-overwrite

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.event.head_commit.message != 'Apply canonical rustfmt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/linked-symlink-rename-overwrite
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rename_overwrite_tx.rs src/path_rename_overwrite.rs tests/path_linked_symlink_rename_overwrite.rs
          git commit -m "Apply canonical rustfmt"
          git push origin HEAD:conquest/linked-symlink-rename-overwrite
