name: Format diagnostic

on:
  pull_request:

jobs:
  rustfmt-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Produce canonical formatting
        run: |
          cargo fmt --all
          git diff --binary > rustfmt.diff
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-diff
          path: rustfmt.diff
