name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format diagnostic
        run: cargo fmt --all
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-output
          path: |
            src/path_hard_link.rs
            tests/path_hard_link.rs
      - name: Stop after diagnostic
        run: exit 1
