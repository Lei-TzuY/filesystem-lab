name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format diagnostic
        run: |
          cargo fmt --all
          git diff > rustfmt.diff
      - name: Upload rustfmt diff
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-diff
          path: rustfmt.diff
      - name: Fail if formatting changed
        run: git diff --exit-code
