name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply Clippy fixes
        run: |
          cargo clippy --fix --all-targets --all-features --allow-dirty --allow-staged -- -D warnings
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "LeiZ"
            git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
            git add src/path_directory_rename_overwrite.rs tests/path_directory_rename_overwrite_recovery_boundary.rs
            git commit -m "Apply Clippy fixes"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
