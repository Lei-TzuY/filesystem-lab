name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Canonical format
        run: cargo fmt --all
      - name: Upload canonical path-move files
        uses: actions/upload-artifact@v4
        with:
          name: canonical-path-move
          path: |
            src/path_move.rs
            tests/path_move.rs
      - name: Show formatting drift
        run: git diff --exit-code
