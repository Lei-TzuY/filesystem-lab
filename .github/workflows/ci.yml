name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy diagnostic
        run: |
          set +e
          cargo clippy --all-targets --all-features -- -D warnings > clippy.txt 2>&1
          echo $? > clippy-exit.txt
      - name: Upload Clippy diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: clippy-diagnostic
          path: |
            clippy.txt
            clippy-exit.txt
      - name: Test
        run: cargo test --all-targets --all-features
