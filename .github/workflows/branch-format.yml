name: Branch format

on:
  push:
    branches:
      - conquest/path-truncate-recovery-boundary

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/path-truncate-recovery-boundary
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: |
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add --all
          git commit -m "Apply canonical rustfmt"
          git push origin HEAD:conquest/path-truncate-recovery-boundary
