name: Temporary rustfmt fixer

on:
  push:
    branches:
      - conquest/path-unlink-recovery-boundary

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/path-unlink-recovery-boundary
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/path_unlink.rs tests/path_file_unlink_recovery_boundary.rs
          git commit -m "Apply rustfmt"
          git push origin HEAD:conquest/path-unlink-recovery-boundary
