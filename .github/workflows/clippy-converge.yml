name: Clippy Converge

on:
  push:
    branches:
      - bil-239-path-lookup

permissions:
  contents: write

jobs:
  clippy-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bil-239-path-lookup
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Capture exact CI clippy output
        run: |
          if test -f .clippy-output.txt; then
            exit 0
          fi
          set +e
          cargo clippy --all-targets --all-features -- -D warnings > .clippy-output.txt 2>&1
          status=$?
          set -e
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add .clippy-output.txt
          git commit -m "Capture temporary clippy diagnostic"
          git push origin HEAD:bil-239-path-lookup
          exit $status
