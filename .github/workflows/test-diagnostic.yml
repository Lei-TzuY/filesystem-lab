name: test-diagnostic

on:
  push:
    branches:
      - bil-275-path-truncate

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run full test suite and capture output
        shell: bash
        run: |
          set +e
          cargo test --all-targets --all-features > /tmp/test-output.txt 2>&1
          status=$?
          echo "$status" > /tmp/test-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: test-diagnostic
          path: |
            /tmp/test-output.txt
            /tmp/test-status.txt
