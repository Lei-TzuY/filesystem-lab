name: Test diagnostic

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests and capture output
        shell: bash
        run: |
          set +e
          cargo test --all --all-targets 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          echo "$status" > test-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: test-diagnostic-output
          path: |
            test-output.txt
            test-status.txt
