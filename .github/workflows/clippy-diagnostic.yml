name: Clippy diagnostic

on:
  pull_request:

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-log
          path: clippy.log
