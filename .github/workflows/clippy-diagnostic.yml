name: Clippy Diagnostic

on:
  pull_request:

jobs:
  clippy-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Capture clippy diagnostics
        run: |
          cargo clippy --all-targets --all-features -- -D warnings > clippy.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: clippy-log
          path: clippy.log
