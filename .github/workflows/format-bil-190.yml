name: Format BIL-190

on:
  push:
    branches:
      - bil-190-same-file-range-exchange

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bil-190-same-file-range-exchange
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/file_exchange.rs tests/file_exchange_crash_matrix.rs
            git commit -m "Apply canonical rustfmt"
            git push origin HEAD:bil-190-same-file-range-exchange
          fi
