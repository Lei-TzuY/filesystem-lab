name: Rustfmt Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.event.pull_request.head.ref == 'bil-199-symlink'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bil-199-symlink
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply stable rustfmt
        run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fsck.rs src/symlink.rs tests/symlink_crash_matrix.rs
          git commit -m "Apply canonical rustfmt"
          git push origin HEAD:bil-199-symlink
