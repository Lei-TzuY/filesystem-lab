name: Rustfmt convergence

on:
  push:
    branches:
      - bil-261-pathname-range-write

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bil-261-pathname-range-write
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical rustfmt
        run: cargo fmt --all
      - name: Commit canonical formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Lei-TzuY"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add --all
          git commit -m "Apply canonical rustfmt to pathname write regression"
          git push origin HEAD:bil-261-pathname-range-write
