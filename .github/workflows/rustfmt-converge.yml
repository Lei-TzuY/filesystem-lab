name: Rustfmt Converge

on:
  push:
    branches:
      - bil-239-path-lookup

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bil-239-path-lookup
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add src tests
          git commit -m "Apply canonical formatting to path lookup"
          git push origin HEAD:bil-239-path-lookup
