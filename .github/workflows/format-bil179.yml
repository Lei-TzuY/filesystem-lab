name: Format BIL-179

on:
  push:
    branches:
      - bil-179-clone-splice

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bil-179-clone-splice
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/file_clone_splice.rs tests/file_clone_splice_crash_matrix.rs
          git commit -m "Apply canonical formatting to clone splice"
          git push origin HEAD:bil-179-clone-splice
